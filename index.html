  <div class="cards text-center" style="margin-top: 2rem; margin-bottom: 0;">
    <div class="card important">
      <h2>⚠️ JavaScript is Disabled</h2>
      <p>This site requires JavaScript to display rooms, photos, and application forms. Without it, the page will be blank.</p>

      <p><strong>Why is it disabled?</strong> It may have been turned off in your browser settings, or blocked by a school or work network.</p>

      <h3><strong>How to enable it:</strong></h3>

      <p><strong>On your phone:</strong><br>
        <strong>Chrome (Android):</strong> Tap the three dots → Settings → Site Settings → JavaScript → turn it on.<br>
        <strong>Safari (iPhone):</strong> Go to your phone's Settings app → Safari → Advanced → turn JavaScript on.
      </p>

      <p><strong>On a computer:</strong><br>
        <strong>Chrome/Edge:</strong> Press <code>F12</code> → <code>Ctrl+Shift+P</code> → type "Enable JavaScript" → refresh.<br>
        <strong>Firefox:</strong> Go to <code>about:config</code> → search <code>javascript.enabled</code> → set it to <code>true</code> → refresh.<br>
        <strong>Safari:</strong> Preferences → Security → tick "Enable JavaScript" → refresh.
      </p>

      <p>If you are on a school or work network and JavaScript is blocked, contact your administrator to allow it for this site.</p>
    </div>
  </div>
</noscript>
